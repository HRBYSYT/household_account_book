<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿ダッシュボード</title>
  <!-- グラフを描画するためのライブラリ（Chart.js） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; font-size: 20px; margin-bottom: 20px; }
    .month-selector { text-align: center; margin-bottom: 20px; }
    input[type="month"] { padding: 8px 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
    .chart-container { position: relative; width: 100%; max-width: 300px; margin: 0 auto 20px auto; }
    .total-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
    .total-center .label { font-size: 12px; color: #666; }
    .total-center .amount { font-size: 22px; font-weight: bold; }
    .details-list { list-style: none; padding: 0; margin: 0; }
    .details-list li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 16px; }
    .details-list li:last-child { border-bottom: none; }
    .loading { text-align: center; font-size: 14px; color: #999; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>家計簿ダッシュボード</h1>
    
    <!-- 月を切り替えるカレンダー -->
    <div class="month-selector">
      <input type="month" id="monthInput">
    </div>

    <div id="loading" class="loading">データを読み込み中...</div>

    <!-- ドーナツグラフと中央の合計金額 -->
    <div class="chart-container" id="chartArea">
      <canvas id="myChart"></canvas>
      <div class="total-center">
        <div class="label">合計金額</div>
        <div class="amount" id="totalAmount">¥0</div>
      </div>
    </div>

    <!-- 項目の内訳リスト -->
    <ul class="details-list" id="detailsList"></ul>
  </div>

  <script>
    // ★★★ここに先ほどGASでコピーしたURLを貼り付けてください★★★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzvGbokTSig5Q_I8RlATp7ydC8IucNwSksan6slqc4QNTnjNwWzaInCt5j6ZkhDynDSkw/exec";
    
    let myChart = null;

    // 画面が開いた時の処理
    window.onload = () => {
      // 現在の月（例: 2026-09）をセット
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      document.getElementById('monthInput').value = `${yyyy}-${mm}`;
      
      // 最初のデータを読み込む
      fetchData();
    };

    // 月が変更されたらデータを再読み込み
    document.getElementById('monthInput').addEventListener('change', fetchData);

    async function fetchData() {
      const month = document.getElementById('monthInput').value;
      if (!month) return;

      document.getElementById('loading').style.display = 'block';
      document.getElementById('chartArea').style.opacity = '0.3';

      try {
        const response = await fetch(`${GAS_URL}?month=${month}`, { redirect: "follow" });
        const data = await response.json();
        updateDashboard(data);
      } catch (error) {
        alert("データの取得に失敗しました。URLが正しいか確認してください。");
        console.error(error);
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('chartArea').style.opacity = '1';
      }
    }

    function updateDashboard(data) {
      // 合計金額の更新
      document.getElementById('totalAmount').innerText = "¥" + data.totalAmount.toLocaleString();

      // 内訳リストの更新
      const listElement = document.getElementById('detailsList');
      listElement.innerHTML = "";
      let labels = [];
      let amounts = [];
      let backgroundColors = [
        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
      ];

      data.details.forEach(item => {
        // リストに追加
        const li = document.createElement('li');
        li.innerHTML = `<span>${item.category}</span> <span>¥${item.amount.toLocaleString()}</span>`;
        listElement.appendChild(li);

        // グラフ用のデータに追加
        labels.push(item.category);
        amounts.push(item.amount);
      });

      // グラフの描画・更新
      const ctx = document.getElementById('myChart').getContext('2d');
      if (myChart) {
        myChart.destroy(); // 既にグラフがあればリセット
      }
      
      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: amounts,
            backgroundColor: backgroundColors,
            borderWidth: 2
          }]
        },
        options: {
          cutout: '70%', // ドーナツの穴の大きさ
          responsive: true,
          plugins: {
            legend: { position: 'bottom' } // 凡例は下に配置
          }
        }
      });
    }
  </script>
</body>
</html>
